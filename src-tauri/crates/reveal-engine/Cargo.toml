[package]
name = "reveal-engine"
description = "Film-look engine: spektrafilm-rs orchestration, render scheduler, export"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
reveal-decode = { path = "../reveal-decode" }
spektrafilm-core.workspace = true
spektrafilm-gpu.workspace = true
spektrafilm-math.workspace = true
image.workspace = true
anyhow.workspace = true
rayon.workspace = true
serde = { version = "1", features = ["derive"] }
# The GPU path for the Rapid engine (rapid_gpu.rs). Same wgpu major the
# spektrafilm-gpu dependency already pulls in — two wgpu versions in one
# binary would mean two device backends fighting over the same adapter.
wgpu = "24"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"

[dev-dependencies]
serde_json = "1"
